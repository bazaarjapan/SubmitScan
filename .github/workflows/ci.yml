name: CI

on:
  push:
    branches: ['main', 'issue-*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Apps Script syntax
        run: node --check "コード.js"

      - name: Run unit tests
        run: node --test tests/*.test.js
